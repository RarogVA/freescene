name: Android and TV
on:
  push:
    paths: ['lib/**', 'packages/**', 'test/**', 'android/**', 'pubspec.*', 'tools/build_android*.py', 'tools/test_android.py', 'tools/android-audio-dependencies.json', 'native/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['lib/**', 'packages/**', 'test/**', 'android/**', 'pubspec.*', 'tools/build_android*.py', 'tools/test_android.py', 'tools/android-audio-dependencies.json', 'native/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: sdkmanager "ndk;28.2.13676358"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            build/android-native/
            build/dependencies/libtorrent/
            build/android-audio/
          key: android-engine-${{ runner.os }}-${{ hashFiles('tools/build_android_engine.py', 'tools/build_android_audio.py', 'tools/android-audio-dependencies.json', 'native/**') }}
          restore-keys: android-engine-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 tools/build_android.py --flavor mobile --preview
      - run: python3 tools/test_android.py
      - run: python3 tools/build_android.py --flavor tv --preview
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/android-native/
            build/dependencies/libtorrent/
            build/android-audio/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-preview-and-tests
          path: |
            build/android-artifacts/
            build/app/reports/tests/
          if-no-files-found: warn
