name: freescene
description: "FreeScene media catalogue for macOS, Android and Android TV"
publish_to: 'none'
version: 1.8.3+49

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  freescene_provider_host:
    path: packages/freescene_provider_host
  freescene_provider_api:
    path: packages/freescene_provider_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/branding/app-icon.png
    - assets/branding/LICENSE.txt
    - assets/fonts/
    - assets/player/
    - licenses/
  fonts:
    - family: Play
      fonts:
        - asset: assets/fonts/Play-Regular.ttf
          weight: 400
        - asset: assets/fonts/Play-Bold.ttf
          weight: 700
